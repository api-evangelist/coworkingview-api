name: CoworkingView API
description: >-
  An independent search and comparison platform for coworking spaces and flexible workspace across Europe and the Middle
  East, exposing a read-only REST API and a hosted MCP server with operator-published prices, amenities
  and location data. Holds no availability and books nothing; free with no commission and no API key required for reads.
