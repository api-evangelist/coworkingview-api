                                  - GBP
                                  - USD
                                  - CHF
                                  - VES
                                  - AED
                              required:
                              - amount
                              - currency
                              additionalProperties: false
                            priceOnRequest:
                              type: boolean
                            billingPeriod:
                              type: string
                              enum:
                              - month
                              - day
                              - hour
                              - week
                              - year
                              - once
                            minCapacity:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            maxCapacity:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                          required:
                          - optionType
                          - title
                          - priceOnRequest
                          - billingPeriod
                          additionalProperties: false
                      marketPosition:
                        type: object
                        properties:
                          verdict:
                            type: string
                            enum:
                            - below
                            - around
                            - above
                          median:
                            type: object
                            properties:
