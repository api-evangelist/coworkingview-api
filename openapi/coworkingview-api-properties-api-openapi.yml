  /v1/properties/{slug}:
    get:
      operationId: propertyDetail
      summary: Full property detail
      description: 'Full detail for one space: address, published prices by workspace type, amenities, capacity and operator. `slug` is the catalogue slug from listProperties or searchSuggest. Returns 404 when the slug does not exist. No API key.'
      tags:
      - Properties
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[a-z0-9-]+$
      - name: locale
        in: query
        required: true
        schema:
          type: string
          enum:
          - en
          - de
          - es
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      slug:
                        type: string
                        minLength: 1
                        maxLength: 200
                        pattern: ^[a-z0-9-]+$
                      title:
                        type: string
                      countryCode:
                        type: string
                        minLength: 2
                        maxLength: 2
                      city:
                        type: object
                        properties:
                          slug:
                            type: string
                            minLength: 1
                            maxLength: 200
                            pattern: ^[a-z0-9-]+$
                          name:
                            type: string
                        required:
                        - slug
                        - name
                        additionalProperties: false
                      zone:
                        type: object
                        properties:
                          slug:
                            type: string
                            minLength: 1
                            maxLength: 200
                            pattern: ^[a-z0-9-]+$
                          name:
                            type: string
                        required:
                        - slug
                        - name
                        additionalProperties: false
                      operator:
                        type: object
                        properties:
                          slug:
                            type: string
                            minLength: 1
                            maxLength: 200
                            pattern: ^[a-z0-9-]+$
                          name:
                            type: string
                          logo:
                            type: object
                            properties:
                              url:
                                type: string
                                format: uri
                              width:
                                type: integer
                                exclusiveMinimum: 0
                                maximum: 9007199254740991
                              height:
                                type: integer
                                exclusiveMinimum: 0
                                maximum: 9007199254740991
                              alt:
                                type: string
                              thumbHash:
                                type: string
                            required:
                            - url
                            - width
                            - height
                            - alt
                            additionalProperties: false
                        required:
                        - slug
                        - name
                        additionalProperties: false
                      coordinates:
                        type: object
                        properties:
                          lat:
                            type: number
                            minimum: -90
                            maximum: 90
                          lng:
                            type: number
                            minimum: -180
                            maximum: 180
                        required:
                        - lat
                        - lng
                        additionalProperties: false
                      fromPrice:
                        type: object
                        properties:
                          amount:
                            type: number
                            minimum: 0
                          currency:
                            type: string
                            enum:
                            - EUR
                            - GBP
                            - USD
                            - CHF
                            - VES
                            - AED
                        required:
                        - amount
                        - currency
                        additionalProperties: false
                      fromBillingPeriod:
                        type: string
                        enum:
                        - month
                        - day
                        - hour
                        - week
                        - year
                        - once
                      rating:
                        type: object
                        properties:
                          score:
                            type: number
                            minimum: 0
                            maximum: 5
                          count:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                        - score
                        - count
                        additionalProperties: false
                      featured:
                        type: boolean
                      updatedAt:
                        description: When the underlying CMS record was last updated. Use as a price-freshness signal; absent for rows with no tracked update time.
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      description:
                        type: string
                      address:
                        type: string
                      images:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              format: uri
                            width:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            height:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            alt:
                              type: string
                            thumbHash:
                              type: string
                          required:
