                          - width
                          - height
                          - alt
                          additionalProperties: false
                      amenities:
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 200
                          pattern: ^[a-z0-9_-]+$
                      capacity:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      pricingOptions:
                        type: array
                        items:
                          type: object
                          properties:
                            optionType:
                              type: string
                              enum:
                              - private_office
                              - exclusive_bereich
                              - fix_desk
                              - flex_desk
                              - day_pass
                              - meeting_room
                              - virtual_office
                              - event_space
                              - membership
                            title:
                              type: string
                            price:
                              type: object
                              properties:
                                amount:
                                  type: number
                                  minimum: 0
                                currency:
                                  type: string
                                  enum:
