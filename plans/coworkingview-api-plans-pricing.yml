name: CoworkingView Plans and Pricing
description: >-
  CoworkingView publishes no API pricing tiers: both the REST API and the hosted MCP server are free, read-only,
  no sign-up and no API key, rate-limited per IP. The business is free to the searching company (no commission,
  no success fee); some operators pay a commission on a successful introduction, which does not affect the
  quoted price or result order.
