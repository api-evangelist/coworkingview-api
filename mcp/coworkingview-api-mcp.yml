method: probed
source: POST https://mcp.coworkingview.com/mcp {"jsonrpc":"2.0","method":"tools/list"} returned HTTP 200
  with 10 tools, each carrying a real JSON Schema draft-07 inputSchema AND outputSchema. Connection guide
