name: CoworkingView MCP Server
description: Official hosted, remote MCP server (Streamable HTTP) for CoworkingView, exposing 10 read-only
  tools for discovering, searching, comparing and profiling coworking spaces, operators, places and market
  rates across Europe and the Middle East. No sign-up and no API key; rate-limited per IP.
